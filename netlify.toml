[build]
  command = "NODE_OPTIONS=--max-old-space-size=3072 tinacms build && docusaurus build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"

# Redirect legacy URLs after file renames (301 = permanent, SEO-safe)
[[redirects]]
  from = "/docs/Calendario Turni"
  to = "/docs/calendario-turni"
  status = 301

[[redirects]]
  from = "/docs/Calendario%20Turni"
  to = "/docs/calendario-turni"
  status = 301
